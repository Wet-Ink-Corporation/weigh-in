name: release
# A tag v<version> (matching plugin.json and Cargo.toml) builds the binaries, packages the plugin
# with its skill stamped to this release's Linux binary, and publishes the GitHub release that
# the skill downloads from in Cowork, then replaces the `marketplace` branch Claude Code installs
# from (D-0009). Push the tag only after the commit is on main.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: versions agree with the tag, which is on main and has a changelog entry
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          v="${GITHUB_REF_NAME#v}"
          grep -q "\"version\": \"$v\"" plugin/.claude-plugin/plugin.json
          grep -q "^version = \"$v\"" Cargo.toml
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "tag $GITHUB_REF_NAME is not on main; merge first, then tag" >&2; exit 1; }
          scripts/changelog-section.sh "$v" >/dev/null

  test:
    uses: ./.github/workflows/ci.yml

  build:
    needs: [versions, test]
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-musl, bin: weighin }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, bin: weighin.exe }
          - { os: macos-latest, target: aarch64-apple-darwin, bin: weighin }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (pinned by rust-toolchain.toml)
        run: rustup target add ${{ matrix.target }}
      - name: musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - name: build
        run: cargo build --release --target ${{ matrix.target }} -p weighin
        env:
          CC_x86_64_unknown_linux_musl: musl-gcc
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: target/${{ matrix.target }}/release/${{ matrix.bin }}

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          # The build artifacts only (each named for its target): a rerun of this job also sees
          # the release-assets artifact of the attempt that failed (#43).
          pattern: "*-*-*"
          path: plugin/libexec
      - name: package the plugin (skill stamped with this build's Linux binary)
        # The Cowork skill downloads the Linux binary from this release with no GitHub login, so
        # only a public repository's zip may point at it; otherwise Cowork uses a connected folder.
        run: |
          chmod +x plugin/libexec/*/weighin
          if [ "${{ github.event.repository.visibility }}" = public ]; then
            scripts/package-plugin.sh
          else
            scripts/package-plugin.sh --no-download
          fi
      - name: release assets
        run: |
          v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin/.claude-plugin/plugin.json)
          mkdir assets
          cp plugin/libexec/x86_64-unknown-linux-musl/weighin assets/weighin-x86_64-unknown-linux-musl
          cp plugin/libexec/x86_64-pc-windows-msvc/weighin.exe assets/weighin-x86_64-pc-windows-msvc.exe
          cp plugin/libexec/aarch64-apple-darwin/weighin assets/weighin-aarch64-apple-darwin
          cp "dist/weigh-in-plugin-$v.zip" assets/
          (cd assets && sha256sum * > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@v7
        with:
          name: release-assets
          path: assets/
      - name: marketplace branch, built and validated before anything is published (D-0009)
        run: |
          v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin/.claude-plugin/plugin.json)
          scripts/marketplace-branch.sh "dist/weigh-in-plugin-$v.zip" "$RUNNER_TEMP/marketplace"
          npm install -g @anthropic-ai/claude-code
          (cd "$RUNNER_TEMP/marketplace" && claude plugin validate .)
      - name: publish
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          {
            scripts/changelog-section.sh "$v"
            echo
            echo "Upload weigh-in-plugin-$v.zip under Customize > Plugins. SHA256SUMS lists every asset."
          } > notes.md
          gh release create "$GITHUB_REF_NAME" assets/* \
            --title "Weigh-In $GITHUB_REF_NAME" \
            --notes-file notes.md
      - name: publish the marketplace branch (one commit, replaced each release; B-14)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git -C "$RUNNER_TEMP/marketplace" push --force \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            HEAD:refs/heads/marketplace
