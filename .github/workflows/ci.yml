name: ci
# The checks every change to main must pass: the same gate as local development (CLAUDE.md).
# The release workflow calls this before it builds anything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux is what Cowork runs; Windows is where the launcher, paths and CRLF guards matter;
        # macOS is a release target, and its symlinked temp dirs are a B-08 case.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
      # On a pull request rust.yml's gate already runs fmt, the tests and the docs on Linux, so
      # the Linux leg only reports, keeping the ruleset's required `check (ubuntu-latest)`
      # (wi-218cc3). Pushes to main and the release's call run it in full.
      SKIP_LINUX_DUPLICATE: ${{ matrix.os == 'ubuntu-latest' && github.event_name == 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: env.SKIP_LINUX_DUPLICATE != 'true'
      - name: toolchain (pinned by rust-toolchain.toml)
        if: env.SKIP_LINUX_DUPLICATE != 'true'
        run: rustup toolchain install
      - run: cargo fmt --all --check
        if: env.SKIP_LINUX_DUPLICATE != 'true'
      # Clippy and rustdoc lints are checked once, by rust.yml's `Lint (temper)` step on Linux,
      # against the committed baseline (.claude/temper-baseline.json): only new findings fail.
      # A `-D warnings` run here would fail on the recorded legacy findings.
      - run: cargo test --locked --workspace
        if: env.SKIP_LINUX_DUPLICATE != 'true'
      - run: cargo doc --workspace --no-deps
        if: env.SKIP_LINUX_DUPLICATE != 'true'
  plugin:
    # The plugin as shipped: manifests valid, the skill's one stamp intact, versions and changelog
    # in step, package-plugin.sh producing a zip whose skill is stamped and launcher runs, and the
    # marketplace branch the release would publish from that zip.
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - name: stamp, versions and changelog
        run: |
          sh tests/cowork-fetch-check.sh
          v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin/.claude-plugin/plugin.json)
          grep -q "^version = \"$v\"" Cargo.toml \
            || { echo "Cargo.toml and plugin.json disagree on the version ($v)" >&2; exit 1; }
          grep -q "\"version\": \"$v\"" plugin-mod/.claude-plugin/plugin.json \
            || { echo "plugin-mod/ and plugin/ disagree on the version ($v)" >&2; exit 1; }
          scripts/changelog-section.sh "$v" >/dev/null
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: package
        run: |
          cargo build --locked -p weighin
          mkdir -p plugin/libexec/x86_64-unknown-linux-gnu
          cp target/debug/weighin plugin/libexec/x86_64-unknown-linux-gnu/
          sh plugin/libexec/weighin --version
          # A stand-in Windows build: packaging must also place it at libexec/weighin.exe, which
          # Windows exec-form hooks start (B-16).
          mkdir -p plugin/libexec/x86_64-pc-windows-msvc
          cp target/debug/weighin plugin/libexec/x86_64-pc-windows-msvc/weighin.exe
          scripts/package-plugin.sh --no-download
          zip="dist/weigh-in-plugin-$VERSION.zip"
          unzip -p "$zip" libexec/cowork-fetch.sh | grep -q "V=$VERSION; S=none;"
          unzip -l "$zip" | grep -q 'libexec/x86_64-unknown-linux-gnu/weighin$'
          unzip -l "$zip" | grep -q ' libexec/weighin.exe$' \
            || { echo "package-plugin.sh did not place the Windows build at libexec/weighin.exe" >&2; exit 1; }
          # weigh-mod (B-35): the mod with its own copy of the launchers and binaries, no tests.
          mod="dist/weigh-mod-plugin-$VERSION.zip"
          unzip -l "$mod" | grep -q ' hooks/mod/register.tsx$'
          unzip -l "$mod" | grep -q 'libexec/x86_64-unknown-linux-gnu/weighin$'
          unzip -l "$mod" | grep -q ' libexec/weighin.exe$'
          if unzip -l "$mod" | grep -q '\.test\.ts$'; then echo "the mod zip ships its tests" >&2; exit 1; fi
          # A stray folder in libexec/ (a release rerun's assets, #43) is refused, not shipped.
          mkdir plugin/libexec/release-assets && touch plugin/libexec/release-assets/SHA256SUMS
          if scripts/package-plugin.sh --no-download 2>/dev/null; then
            echo "package-plugin.sh shipped a stray plugin/libexec/release-assets/" >&2; exit 1
          fi
          rm -r plugin/libexec/release-assets
      - name: claude plugin validate (Node from the runner image)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
      - name: mod (validate --strict, claude plugin test, strict tsc)
        env:
          TSC: npx --yes -p typescript@6.0.2 tsc
        run: bash tests/mod-check.sh
      - name: marketplace branch as the release builds it (D-0009)
        run: |
          mp="$RUNNER_TEMP/marketplace"
          scripts/marketplace-branch.sh "dist/weigh-in-plugin-$VERSION.zip" "dist/weigh-mod-plugin-$VERSION.zip" "$mp"
          git -C "$mp" ls-tree -r HEAD plugin/libexec | grep -q '^100755 .*libexec/x86_64-unknown-linux-gnu/weighin$' \
            || { echo "the marketplace commit must hold the binary as executable (100755)" >&2; exit 1; }
          git -C "$mp" ls-tree -r HEAD plugin/libexec | grep -q '^100755 .*libexec/weighin$'
          git -C "$mp" ls-tree -r HEAD plugin/libexec | grep -q '^100755 .*libexec/weighin.exe$'
          git -C "$mp" ls-tree -r HEAD plugin-mod/libexec | grep -q '^100755 .*libexec/x86_64-unknown-linux-gnu/weighin$'
          git -C "$mp" ls-tree -r HEAD plugin-mod/libexec | grep -q '^100755 .*libexec/weighin$'
          grep -q "V=$VERSION; S=none;" "$mp/plugin/libexec/cowork-fetch.sh"
          (cd "$mp" && claude plugin validate .)
          sh "$mp/plugin/libexec/weighin" --version
          # Hooks start the launcher with no shell (exec form, B-16), as a checkout of the branch has it.
          git -C "$mp" checkout -q -- . && "$mp/plugin/libexec/weighin" --version

  deny:
    # Advisories, licences and sources of every dependency (deny.toml). On a pull request
    # rust.yml's gate runs `cargo deny` already (wi-218cc3); pushes and the release still run it.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
