name: ci
# The checks every change to main must pass: the same gate as local development (CLAUDE.md).
# The release workflow calls this before it builds anything.
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        # Linux is what Cowork runs; Windows is where the launcher, paths and CRLF guards matter;
        # macOS is a release target, and its symlinked temp dirs are a B-08 case.
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - run: cargo fmt --all --check
      # Clippy and rustdoc lints are checked once, by rust.yml's `Lint (temper)` step on Linux,
      # against the committed baseline (.claude/temper-baseline.json): only new findings fail.
      # A `-D warnings` run here would fail on the recorded legacy findings.
      - run: cargo test --workspace
      - run: cargo doc --workspace --no-deps
  plugin:
    # The plugin as shipped: manifests valid, the skill's one stamp intact, versions and changelog
    # in step, package-plugin.sh producing a zip whose skill is stamped and launcher runs, and the
    # marketplace branch the release would publish from that zip.
    runs-on: ubuntu-latest
    env:
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@v7
      - name: toolchain (pinned by rust-toolchain.toml)
        run: rustup toolchain install
      - name: stamp, versions and changelog
        run: |
          [ "$(grep -c 'V=dev; S=none;' plugin/skills/weigh-in/SKILL.md)" = 1 ] \
            || { echo "SKILL.md must hold exactly one 'V=dev; S=none;' in the repository" >&2; exit 1; }
          v=$(sed -n 's/.*"version": *"\([^"]*\)".*/\1/p' plugin/.claude-plugin/plugin.json)
          grep -q "^version = \"$v\"" Cargo.toml \
            || { echo "Cargo.toml and plugin.json disagree on the version ($v)" >&2; exit 1; }
          scripts/changelog-section.sh "$v" >/dev/null
          echo "VERSION=$v" >> "$GITHUB_ENV"
      - name: package
        run: |
          cargo build -p weighin
          mkdir -p plugin/libexec/x86_64-unknown-linux-gnu
          cp target/debug/weighin plugin/libexec/x86_64-unknown-linux-gnu/
          sh plugin/libexec/weighin --version
          scripts/package-plugin.sh --no-download
          zip="dist/weigh-in-plugin-$VERSION.zip"
          unzip -p "$zip" skills/weigh-in/SKILL.md | grep -q "V=$VERSION; S=none;"
          unzip -l "$zip" | grep -q 'libexec/x86_64-unknown-linux-gnu/weighin$'
          # A stray folder in libexec/ (a release rerun's assets, #43) is refused, not shipped.
          mkdir plugin/libexec/release-assets && touch plugin/libexec/release-assets/SHA256SUMS
          if scripts/package-plugin.sh --no-download 2>/dev/null; then
            echo "package-plugin.sh shipped a stray plugin/libexec/release-assets/" >&2; exit 1
          fi
          rm -r plugin/libexec/release-assets
      - name: claude plugin validate (Node from the runner image)
        run: |
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
      - name: marketplace branch as the release builds it (D-0009)
        run: |
          mp="$RUNNER_TEMP/marketplace"
          scripts/marketplace-branch.sh "dist/weigh-in-plugin-$VERSION.zip" "$mp"
          git -C "$mp" ls-tree -r HEAD plugin/libexec | grep -q '^100755 .*libexec/x86_64-unknown-linux-gnu/weighin$' \
            || { echo "the marketplace commit must hold the binary as executable (100755)" >&2; exit 1; }
          git -C "$mp" ls-tree -r HEAD plugin/libexec | grep -q '^100755 .*libexec/weighin$'
          grep -q "V=$VERSION; S=none;" "$mp/plugin/skills/weigh-in/SKILL.md"
          (cd "$mp" && claude plugin validate .)
          sh "$mp/plugin/libexec/weighin" --version

  deny:
    # Advisories, licences and sources of every dependency (deny.toml).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: EmbarkStudios/cargo-deny-action@v2
