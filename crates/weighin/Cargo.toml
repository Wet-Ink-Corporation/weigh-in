[package]
name = "weighin"
description = "Weigh-In CLI: the single writer of the decision ledger."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
# Internal (D-0007): never published to crates.io.
publish = false

[[bin]]
name = "weighin"
path = "src/main.rs"

[dependencies]
weighin-core.workspace = true
happenstance-core.workspace = true
happenstance-sqlite.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
clap.workspace = true
anyhow.workspace = true
time.workspace = true
tempfile.workspace = true

[dev-dependencies]
happenstance-core = { version = "0.3.2", features = ["serde", "memory"] }

[lints]
workspace = true
