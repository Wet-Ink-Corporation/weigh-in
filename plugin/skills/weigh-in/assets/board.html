<title>Weigh-In Board</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
  :root{
    --ground:#EDF1F0; --paper:#FFFFFF; --paper-2:#E3EAE8; --paper-3:#F5F8F7;
    --ink:#14201E; --ink-2:#384845; --muted:#5C6D69; --line:#CED8D5; --line-2:#B7C4C0;
    --accent:#0D6A64; --accent-ink:#FFFFFF; --accent-soft:#D7ECE9;
    --copper:#AE531A; --copper-soft:#F7E5D8;
    --oneway:#A3372A; --oneway-soft:#F6DFDA; --twoway:#2B7549; --twoway-soft:#DAEFE1;
    --amber:#8B6405; --amber-soft:#F6EACA;
    --code-bg:#F2F5F4;
    --shadow:0 1px 2px rgba(20,32,30,.06),0 6px 20px rgba(20,32,30,.06);
    --display:"Bricolage Grotesque","Helvetica Neue",Arial,sans-serif;
    --body:"Instrument Sans","Segoe UI",system-ui,sans-serif;
    --mono:"JetBrains Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      color-scheme:dark;
      --ground:#0E1413; --paper:#151D1B; --paper-2:#1C2725; --paper-3:#18211F;
      --ink:#E4ECE9; --ink-2:#C0CCC8; --muted:#8FA09B; --line:#283432; --line-2:#37443F;
      --accent:#4DB3AA; --accent-ink:#0E1413; --accent-soft:#16312E;
      --copper:#E0894C; --copper-soft:#352216;
      --oneway:#E26F5E; --oneway-soft:#3A1D19; --twoway:#5CBE86; --twoway-soft:#15301F;
      --amber:#D8AF48; --amber-soft:#31280F;
      --code-bg:#111917;
      --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
    }
  }
  :root[data-theme="dark"]{
    color-scheme:dark;
    --ground:#0E1413; --paper:#151D1B; --paper-2:#1C2725; --paper-3:#18211F;
    --ink:#E4ECE9; --ink-2:#C0CCC8; --muted:#8FA09B; --line:#283432; --line-2:#37443F;
    --accent:#4DB3AA; --accent-ink:#0E1413; --accent-soft:#16312E;
    --copper:#E0894C; --copper-soft:#352216;
    --oneway:#E26F5E; --oneway-soft:#3A1D19; --twoway:#5CBE86; --twoway-soft:#15301F;
    --amber:#D8AF48; --amber-soft:#31280F;
    --code-bg:#111917;
    --shadow:0 1px 2px rgba(0,0,0,.4),0 6px 20px rgba(0,0,0,.35);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--ground);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;padding-inline:clamp(16px,3vw,32px);padding-block:0 64px}
  h1,h2,h3{font-family:var(--display);margin:0;line-height:1.15;text-wrap:balance}
  p{margin:0}
  button,select,input,textarea{font:inherit;color:inherit}
  :focus-visible{outline:2px solid var(--copper);outline-offset:2px}
  .mono{font-family:var(--mono);font-size:.86em}
  .wrap{max-width:1280px;margin:0 auto}

  /* header */
  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:16px 24px;padding-block:28px 18px;border-bottom:1px solid var(--line)}
  .brand{display:grid;gap:4px}
  .brand h1{font-size:30px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
  .brand h1 svg{flex:none}
  .scope{font-family:var(--mono);font-size:12px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 14px}
  .scope b{color:var(--ink-2);font-weight:600}
  .health{display:grid;grid-template-columns:repeat(4,minmax(112px,1fr));gap:8px}
  .tile{background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:8px 12px;display:grid;gap:1px;min-width:0}
  .tile .k{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .tile .v{font-family:var(--display);font-weight:800;font-size:20px;font-variant-numeric:tabular-nums}
  .tile .s{font-size:11.5px;color:var(--muted)}

  /* layout */
  .shell{display:grid;grid-template-columns:320px minmax(0,1fr);gap:24px;padding-top:22px;align-items:start}
  aside.queue{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:grid;gap:18px;max-height:calc(100vh - 32px);overflow:auto;padding-bottom:8px}
  .qgroup{display:grid;gap:6px}
  .qhead{display:flex;justify-content:space-between;align-items:baseline;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-inline:2px}
  .qhead .n{font-family:var(--mono);letter-spacing:0}
  .qitem{display:grid;grid-template-columns:auto minmax(0,1fr);gap:4px 10px;text-align:left;background:var(--paper);border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer;width:100%}
  .qitem:hover{border-color:var(--line-2)}
  .qitem[aria-current="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .qitem .rank{font-family:var(--mono);font-size:12px;color:var(--muted);grid-row:span 2;padding-top:1px;font-variant-numeric:tabular-nums}
  .qitem .qq{font-size:14px;line-height:1.35;color:var(--ink)}
  .qitem .qm{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .qitem.muted .qq{color:var(--ink-2)}
  .qhint{font-size:12px;color:var(--muted);padding-inline:2px}

  /* chips */
  .chip{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11.5px;line-height:1.2;padding:3px 8px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--paper);white-space:nowrap}
  .chip .dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
  .chip.oneway{color:var(--oneway);border-color:var(--oneway);background:var(--oneway-soft)}
  .chip.twoway{color:var(--twoway);border-color:var(--twoway);background:var(--twoway-soft)}
  .chip.amber{color:var(--amber);border-color:var(--amber);background:var(--amber-soft)}
  .chip.accent{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
  .chip.copper{color:var(--copper);border-color:var(--copper);background:var(--copper-soft)}
  .chip.plain{border-color:transparent;background:transparent;padding-inline:0}

  /* focus card */
  main.focus{min-width:0}
  .card{background:var(--paper);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:hidden}
  .card-head{padding:20px 24px 16px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
  .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .card-head h2{font-size:clamp(21px,2.3vw,26px);font-weight:800;letter-spacing:-.01em}
  .why{color:var(--ink-2);max-width:72ch}
  .timing{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:baseline;background:var(--paper-3);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:10px 24px;font-size:14px}
  .timing .lab{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:600;color:var(--twoway)}
  .section{padding:18px 24px;display:grid;gap:12px;border-bottom:1px solid var(--line)}
  .section:last-child{border-bottom:0}
  .slab{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:600}
  .ctx{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px;align-items:start}
  .ctx.single{grid-template-columns:minmax(0,1fr)}
  ul.ev{list-style:none;margin:0;padding:0;display:grid;gap:8px}
  ul.ev li{display:grid;gap:2px;font-size:14px;line-height:1.45}
  ul.ev .src{font-family:var(--mono);font-size:11.5px;color:var(--accent);user-select:all}
  .excerpt{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--code-bg)}
  .excerpt .path{display:flex;justify-content:space-between;gap:8px;font-family:var(--mono);font-size:11.5px;color:var(--muted);padding:6px 10px;border-bottom:1px solid var(--line);background:var(--paper-3)}
  .excerpt .path span{user-select:all;color:var(--ink-2)}
  .excerpt pre{margin:0;padding:8px 0;overflow-x:auto;font-family:var(--mono);font-size:12.5px;line-height:1.55}
  .excerpt code{display:grid}
  .excerpt .ln{display:grid;grid-template-columns:3.2em max-content;gap:10px;padding-right:12px}
  .excerpt .ln i{font-style:normal;color:var(--muted);text-align:right;user-select:none;font-variant-numeric:tabular-nums}
  .excerpt .ln.hl{background:var(--accent-soft)}

  /* options */
  .opts{display:grid;gap:10px}
  .opt{display:grid;grid-template-columns:40px minmax(0,1fr);border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--paper)}
  .opt .letter{display:flex;justify-content:center;padding-top:14px;font-family:var(--display);font-weight:800;font-size:18px;color:var(--ink-2);background:var(--paper-2);border-right:1px solid var(--line)}
  .opt .body{padding:12px 14px;display:grid;gap:6px}
  .opt .t{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
  .opt .t h3{font-size:17px;font-weight:600;font-family:var(--display)}
  .opt .sum{color:var(--ink-2);font-size:14px}
  .opt dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:3px 10px;font-size:13.5px}
  .opt dt{color:var(--muted);font-weight:600}
  .opt dd{margin:0;color:var(--ink-2)}
  .opt .flag{font-size:13px;padding:5px 9px;border-radius:6px}
  .opt .flag.must{color:var(--oneway);background:var(--oneway-soft)}
  .opt .flag.evade{color:var(--amber);background:var(--amber-soft)}
  .opt .act{display:flex;justify-content:flex-end}
  .opt.picked{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
  .opt.picked .letter{background:var(--accent);color:var(--accent-ink)}
  .opt.rec{border-color:var(--copper)}
  .opt.rec.picked{border-color:var(--accent)}
  .opt.ineligible .t h3,.opt.ineligible .sum{text-decoration:line-through;text-decoration-color:var(--oneway);color:var(--muted)}
  .opt.ineligible .letter{color:var(--muted)}

  button.btn{border:1px solid var(--line-2);background:var(--paper);border-radius:7px;padding:7px 13px;font-weight:600;font-size:14px;cursor:pointer}
  button.btn:hover:not([disabled]){border-color:var(--accent);color:var(--accent)}
  button.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button.btn.primary:hover:not([disabled]){filter:brightness(1.08);color:var(--accent-ink)}
  button.btn[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
  button.btn.ghost{background:transparent}
  button.btn[disabled]{opacity:.5;cursor:default}

  /* criteria */
  .tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
  table{border-collapse:collapse;width:100%;font-size:13.5px}
  th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  tr:last-child td{border-bottom:0}
  thead th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;background:var(--paper-3)}
  td:first-child{color:var(--ink-2);font-weight:600;min-width:12em}
  td.recc{background:var(--copper-soft)}
  td.inel{text-decoration:line-through;color:var(--muted)}

  /* recommendation */
  details.rec{border:1px solid var(--copper);border-radius:10px;background:var(--copper-soft)}
  details.rec summary{cursor:pointer;list-style:none;padding:12px 16px;display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;justify-content:space-between}
  details.rec summary::-webkit-details-marker{display:none}
  details.rec summary .h{font-family:var(--display);font-weight:800;font-size:16px}
  details.rec summary .hint{font-size:12.5px;color:var(--muted)}
  details.rec .rb{padding:0 16px 14px;display:grid;gap:10px;font-size:14px}
  details.rec .row{display:grid;grid-template-columns:9.5em minmax(0,1fr);gap:10px}
  details.rec .row .k{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;padding-top:2px}
  details.rec .wrong{border-left:3px solid var(--oneway);padding:6px 10px;background:var(--paper);border-radius:0 6px 6px 0}

  /* record */
  .record{display:grid;gap:10px}
  .record textarea,.record input,.record select{width:100%;border:1px solid var(--line-2);border-radius:7px;background:var(--paper);padding:8px 10px;font-size:14px}
  .record textarea{min-height:64px;resize:vertical}
  .record label{font-size:12px;color:var(--muted);font-weight:600;display:grid;gap:4px}
  .btnrow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .sub{display:grid;gap:8px;border:1px dashed var(--line-2);border-radius:8px;padding:12px}
  .sub .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .status{font-size:13px;color:var(--muted)}
  .status.ok{color:var(--twoway)}
  .status.warn{color:var(--amber)}
  .status.err{color:var(--oneway)}
  .receipt{font-family:var(--mono);font-size:12.5px;line-height:1.6;white-space:pre-wrap;background:var(--paper-3);border:1px solid var(--line);border-radius:8px;padding:10px 12px;color:var(--ink-2)}
  .kbd{font-family:var(--mono);font-size:11px;border:1px solid var(--line-2);border-bottom-width:2px;border-radius:4px;padding:0 4px;color:var(--ink-2)}
  .src-line{font-size:12.5px;color:var(--muted)}
  .reopen{border-left:3px solid var(--amber);background:var(--amber-soft);border-radius:0 6px 6px 0;padding:8px 12px;display:grid;gap:4px;max-width:78ch}
  .reopen p{font-size:14px;color:var(--ink)}
  .flag-line{font-size:13px;color:var(--ink-2);display:flex;flex-wrap:wrap;gap:6px;align-items:center}
  .src-line .mono{user-select:all}

  .empty{background:var(--paper);border:1px dashed var(--line-2);border-radius:12px;padding:28px;display:grid;gap:8px;max-width:64ch}
  .empty h2{font-size:20px}
  .small{font-size:13px;color:var(--muted)}

  @media (max-width:960px){
    .shell{grid-template-columns:1fr}
    aside.queue{position:static;max-height:none}
    .health{grid-template-columns:repeat(2,minmax(0,1fr));width:100%}
  }
  @media (max-width:720px){
    .ctx{grid-template-columns:1fr}
    .sub .grid2{grid-template-columns:1fr}
    details.rec .row{grid-template-columns:1fr;gap:2px}
    .card-head,.section{padding-inline:16px}
    .timing{padding-inline:16px}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">
      <h1><svg width="28" height="28" viewBox="0 0 28 28" aria-hidden="true"><path d="M14 4v19M6 23h16M5 9h18" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" fill="none"/><path d="M5 9l-3 7h6zM23 9l-3 7h6z" fill="none" stroke="var(--copper)" stroke-width="2" stroke-linejoin="round"/></svg>Weigh-In</h1>
      <div class="scope" id="scope"><span>Loading the ledger…</span></div>
    </div>
    <div class="health" id="health" aria-label="Board health"></div>
  </header>

  <div class="shell">
    <aside class="queue" id="queue" aria-label="Items"></aside>
    <main class="focus" id="focus"></main>
  </div>
</div>

<script>
(function(){
  "use strict";
  var C = window.claude;
  function use(name){ try { return (C && typeof C.use === "function") ? C.use(name) : Promise.resolve(null); } catch(e){ return Promise.resolve(null); } }

  var st = { db:null, user:null, canEdit:false, uid:null, state:null, stateErr:null, answers:{}, sel:null, ready:false,
             pick:{}, revealed:{}, openedAt:{}, revealedBeforePick:{}, mode:{}, msg:{} };

  /* ---------- tiny DOM helper (textContent only) ---------- */
  function h(tag, attrs){
    var el = document.createElement(tag);
    if (attrs) for (var k in attrs){
      var v = attrs[k];
      if (v == null || v === false) continue;
      if (k === "class") el.className = v;
      else if (k === "text") el.textContent = v;
      else if (k.slice(0,2) === "on") el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (var i = 2; i < arguments.length; i++){
      var c = arguments[i];
      if (c == null || c === false) continue;
      if (Array.isArray(c)) c.forEach(function(x){ if (x != null && x !== false) el.appendChild(typeof x === "string" ? document.createTextNode(x) : x); });
      else el.appendChild(typeof c === "string" ? document.createTextNode(c) : c);
    }
    return el;
  }
  function clear(el){ while (el.firstChild) el.removeChild(el.firstChild); }
  function str(v){ return typeof v === "string" ? v : (v == null ? "" : String(v)); }
  function arr(v){ return Array.isArray(v) ? v : []; }

  /* ---------- model ---------- */
  function items(){ return st.state ? arr(st.state.items).slice().sort(function(a,b){ return (a.rank||99)-(b.rank||99); }) : []; }
  function defaults(){ return st.state ? arr(st.state.defaults) : []; }
  function settled(){ return st.state ? arr(st.state.settled) : []; }
  function decided(){ return st.state ? arr(st.state.decided) : []; }
  function all(){ return items().map(function(x){return {kind:"item", d:x};})
                    .concat(decided().map(function(x){return {kind:"decided", d:x};}))
                    .concat(defaults().map(function(x){return {kind:"default", d:x};}))
                    .concat(settled().map(function(x){return {kind:"settled", d:x};})); }
  function find(id){ var a = all(); for (var i=0;i<a.length;i++) if (a[i].d.id === id) return a[i]; return null; }
  function optById(it, id){ var o = arr(it.options); for (var i=0;i<o.length;i++) if (o[i].id === id) return o[i]; return null; }
  function recOf(it){ return it.recommendation || {}; }
  function answer(id){ return st.answers[id] || null; }
  function doorChip(door){
    if (door === "one-way") return h("span",{class:"chip oneway"},h("span",{class:"dot"}),"one-way");
    if (door === "two-way") return h("span",{class:"chip twoway"},h("span",{class:"dot"}),"two-way");
    return h("span",{class:"chip"},str(door));
  }
  function answerLabel(a, it){
    if (!a) return null;
    if (a.action === "choose"){ var o = it ? optById(it, a.option) : null; return "chose " + str(a.option) + (o ? " · " + str(o.title) : ""); }
    if (a.action === "defer") return "deferred to " + str(a.defer && a.defer.trigger);
    if (a.action === "dismiss") return "dismissed · " + str(a.reason);
    if (a.action === "not-my-call") return "not my call · " + str(a.who);
    if (a.action === "reopen") return "reopen requested";
    return str(a.action);
  }

  /* ---------- header ---------- */
  function renderHeader(){
    var sc = document.getElementById("scope"); clear(sc);
    if (!st.state){
      sc.appendChild(h("span",{text: st.ready ? "No ledger has been synced to this board yet." : "Loading the ledger…"}));
    } else {
      var s = st.state.scope || {};
      sc.appendChild(h("span",null,"repo ", h("b",{text:str(s.repo)})));
      sc.appendChild(h("span",{text:str(s.session)}));
      if (s.generated_at) sc.appendChild(h("span",{text:"synced " + str(s.generated_at).replace("T"," ").slice(0,16) + " UTC"}));
    }
    var hl = document.getElementById("health"); clear(hl);
    var its = items().concat(decided()), presented = its.length;
    var ans = its.map(function(i){ return answer(i.id); }).filter(Boolean);
    var acted = ans.filter(function(a){ return a.action === "choose" || (a.action === "defer" && a.defer && a.defer.trigger) || a.action === "not-my-call"; }).length;
    var notUseful = ans.filter(function(a){ return a.action === "dismiss" && a.reason === "not-useful"; }).length;
    var chosen = ans.filter(function(a){ return a.action === "choose" && a.recommended; });
    var overrides = chosen.filter(function(a){ return a.option !== a.recommended; }).length;
    var secs = ans.map(function(a){ return a.seconds_to_decide; }).filter(function(x){ return typeof x === "number" && x >= 0; }).sort(function(a,b){return a-b;});
    var med = secs.length ? secs[Math.floor((secs.length-1)/2)] : null;
    function pct(n,d){ return d ? Math.round(100*n/d) + "%" : "—"; }
    function fmtS(s){ if (s == null) return "—"; return s < 90 ? s + " s" : Math.round(s/60) + " min"; }
    [
      {k:"Action rate", v:pct(acted, presented), s: ans.length + " of " + presented + " answered · target ≥60%"},
      {k:"Not useful", v:pct(notUseful, presented), s:"target ≤10%"},
      {k:"Override rate", v:pct(overrides, chosen.length), s: chosen.length + " choice" + (chosen.length===1?"":"s") + " vs recommendation"},
      {k:"Time to decide", v:fmtS(med), s:"median, from opening a card"}
    ].forEach(function(t){ hl.appendChild(h("div",{class:"tile"},h("span",{class:"k",text:t.k}),h("span",{class:"v",text:t.v}),h("span",{class:"s",text:t.s}))); });
  }

  /* ---------- queue ---------- */
  function renderQueue(){

    if (!body.item_id) body.item_id = id;
    setMsg(id,"", "Saving…");
    st.db.doc("answers/" + id).set(body).then(function(){
      st.mode[id] = "choose"; if (st.msg[id]) st.msg[id].draft = "";
      setMsg(id,"ok","Saved. The next /weigh-in sitting applies it to the ledger.");
    }).catch(function(e){
      var c = e && e.code;
      var t = c === "invalid_argument" ? "You don't have permission to record on this board." :
              c === "quota_exceeded" ? "The board's store is full. Run /weigh-in board to prune it." :
              c === "resource_exhausted" ? "Too many saves at once. Wait a moment and try again." :
              "Couldn't save (" + (c || "error") + "). Try again, or use Copy as prompt.";
      setMsg(id,"err",t);
    });
  }
  function copyPrompt(it, picked, note){
    // Plain language for the next sitting, which maps it to `weighin decide` or `weighin defer`
    // (the "Waiting for" field is the trigger, as a saved deferral records it).
    var mode = st.mode[it.id] || "choose", txt;
    function one(s){ return String(s || "").replace(/\s+/g," ").trim(); }
    var tail = note ? " (note: " + one(note) + ")" : "";
    if (mode === "defer"){
      // Mirrors "Record deferral": a trigger and a resolve-by are required, and the default is the
      // one shown in the form, never filled in from the recommendation.
      var tr = document.getElementById("trig-" + it.id), by = document.getElementById("by-" + it.id), df = document.getElementById("def-" + it.id);
      var trv = one(tr ? tr.value : ""), byv = one(by ? by.value : ""), dfv = df ? df.value : "";
      if (!trv || !byv){ setMsg(it.id,"warn","Name what you are waiting for and when it must be settled."); return; }
      txt = "/weigh-in defer " + it.id + " — trigger: " + trv + "; resolve by: " + byv + "; default: " + dfv + tail;
    } else if (mode === "dismiss" || mode === "other"){
      setMsg(it.id,"warn","Copy as prompt covers choosing and deferring; record this one with the button below."); return;
    } else {
      // Mirrors "Record": only an option the owner picked (or already recorded) is copied; the
      // recommendation is never filled in for them.
      if (!picked){ setMsg(it.id,"warn","Pick an option to record."); return; }
      txt = "/weigh-in decide " + it.id + ": " + picked + tail;
    }
    function done(ok){ setMsg(it.id, ok ? "ok" : "warn", ok ? "Copied: " + txt : "Copy blocked here. Select and copy: " + txt); }
    try { navigator.clipboard.writeText(txt).then(function(){ done(true); }, function(){ done(false); }); } catch(e){ done(false); }
  }

  document.addEventListener("keydown", function(ev){
    var t = ev.target && ev.target.tagName;
    if (t === "INPUT" || t === "TEXTAREA" || t === "SELECT" || ev.metaKey || ev.ctrlKey || ev.altKey) return;
    var list = all(); if (!list.length) return;
    var idx = -1; for (var i=0;i<list.length;i++) if (list[i].d.id === st.sel) idx = i;
    if (ev.key === "j"){ select(list[Math.min(list.length-1, idx+1)].d.id); ev.preventDefault(); }
    else if (ev.key === "k"){ select(list[Math.max(0, idx-1)].d.id); ev.preventDefault(); }
    else if (/^[1-4]$/.test(ev.key) && st.canEdit){
      var e = find(st.sel); if (!e || e.kind !== "item") return;
      var o = arr(e.d.options)[Number(ev.key)-1]; if (o && !o.fails_must){ pickOption(e.d, o.id); ev.preventDefault(); }
    }
  });

  function renderAll(){ renderHeader(); renderQueue(); renderFocus(); }

  /* ---------- boot ---------- */
  var hash = (location.hash || "").replace(/^#/, "");
  if (hash) st.sel = hash;
  window.addEventListener("hashchange", function(){ var id = (location.hash || "").replace(/^#/, ""); if (id && id !== st.sel && find(id)) { st.sel = id; renderQueue(); renderFocus(); } });
  renderAll();
  Promise.all([use("db"), use("user")]).then(function(r){
    st.db = r[0]; st.user = r[1];
    if (!st.user) return;
    var u = st.user;
    return Promise.all([
      Promise.resolve().then(function(){ return u.canEdit(); }).then(function(v){ st.canEdit = !!v; }, function(){ st.canEdit = false; }),
      Promise.resolve().then(function(){ return u.id(); }).then(function(v){ st.uid = v || null; }, function(){ st.uid = null; })
    ]);
  }).then(function(){
    st.ready = true;
    if (!st.db){ renderAll(); return; }
    st.db.doc("board/state").onSnapshot(function(snap){
      st.state = snap.exists ? snap.data() : null; st.stateErr = null;
      if (st.state && !find(st.sel)) st.sel = items()[0] ? items()[0].id : null;
      renderAll();
    }, function(e){ st.stateErr = (e && e.code) || "an error"; renderAll(); });
    st.db.collection("answers").onSnapshot(function(snap){
      var m = {}; snap.docs.forEach(function(d){ if (d.exists) m[d.id] = d.data(); });
      st.answers = m; renderAll();
    }, function(){ /* answers are optional to render */ });
    renderAll();
  });
})();
</script>
